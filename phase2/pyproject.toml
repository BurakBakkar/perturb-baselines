[project]
name = "scgpt-ft"
version = "0.1.0"
description = "Phase 2: fine-tune scGPT's perturbation model and write pbench predictions files"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scgpt_ft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
